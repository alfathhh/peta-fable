services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: peta
      POSTGRES_PASSWORD: peta
      POSTGRES_DB: peta
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
  db_test:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: peta
      POSTGRES_PASSWORD: peta
      POSTGRES_DB: peta_test
    ports:
      - "5434:5432"

volumes:
  dbdata:
