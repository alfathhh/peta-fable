# Nginx di dalam container frontend: sajikan SPA statis + proxy /api ke backend.
#
# PENTING (aturan privasi GeoJSON, docs/ARCHITECTURE.md §5): JANGAN tambahkan
# proxy_cache pada location /api/ — backend sudah mengirim
# "Cache-Control: private, no-store" untuk semua respons wilayah/layer,
# header ini harus diteruskan apa adanya, bukan ditimpa oleh cache nginx.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Header keamanan dasar untuk aset frontend (API sudah dilindungi helmet)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy ke service "backend" (nama service di docker-compose.prod.yml)
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m; # muat upload geojson/shp (maks 20MB) + margin
    }

    # SPA fallback — semua route non-file diarahkan ke index.html (React Router)
    location / {
        try_files $uri /index.html;
    }

    # Aset hash (JS/CSS Vite) aman di-cache lama; index.html tidak (biar update terdeteksi)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
